name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Fix outdated intent-launcher package (The Hack & Jetifier)
        run: |
          sed -i 's/compile /implementation /g' node_modules/react-native-intent-launcher/android/build.gradle
          sed -i 's/compile(/implementation(/g' node_modules/react-native-intent-launcher/android/build.gradle
          npx jetifier

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: GDStream-App
          path: android/app/build/outputs/apk/release/app-release.apk
