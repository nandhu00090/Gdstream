name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit

      - name: Ensure Private Release Keystore
        run: |
          if [ ! -f android/app/gdstream-release.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/gdstream-release.keystore \
              -alias gdstreamkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass gdstream2026 -keypass gdstream2026 \
              -dname "CN=GDStream, OU=Media, O=GDStream, L=Chennai, ST=TN, C=IN"
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: GDStream-App
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "GDStream v1.0.${{ github.run_number }} (Latest Build)"
          body: |
            ### 🛡️ GDStream Official Release (Build #${{ github.run_number }})
            - **Commit:** ${{ github.event.head_commit.message }}
            - **Security:** 12-Layer Native C++ NDK Shield + Cloudflare Hardware Lock
            - Direct APK download below 👇
          files: |
            android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
