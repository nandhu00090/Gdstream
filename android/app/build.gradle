apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    externalNativeBuild.cmake.path file("src/main/jni/CMakeLists.txt")
    namespace "com.gdstream"
    defaultConfig {
        applicationId "com.gdstream"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "2.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (file('gdstream-release.keystore').exists()) {
                storeFile file('gdstream-release.keystore')
                storePassword 'gdstream2026'
                keyAlias 'gdstreamkey'
                keyPassword 'gdstream2026'
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.media3:media3-exoplayer:1.8.0") // Match react-native-video 6.19.x.
    implementation("org.jellyfin.media3:media3-ffmpeg-decoder:1.8.0+1") // Software DTS/HD decoder; see THIRD_PARTY_NOTICES.md.
    implementation("com.moizhassan.ffmpeg:ffmpeg-kit-16kb:6.1.1") // External HLS DTS to AC-3 encoder.
    testImplementation("androidx.media3:media3-exoplayer-hls:1.8.0")
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.mockito:mockito-core:5.20.0")
    testImplementation("org.robolectric:robolectric:4.16.1")
    testImplementation("org.json:json:20240303")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
